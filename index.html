<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SAIF Obby</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#83d8ff; font-family:system-ui, sans-serif; touch-action:none; }
  #game { display:block; width:100vw; height:100dvh; }
  #hud { position:fixed; top:12px; right:12px; left:12px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; pointer-events:none; color:#fff; text-shadow:0 2px 4px #17334d; font-weight:800; }
  .pill { background:#142b46cc; border:2px solid #ffffff55; border-radius:14px; padding:8px 12px; box-shadow:0 4px 0 #10233a55; }
  #hint { position:fixed; top:67px; left:50%; transform:translateX(-50%); background:#ffffffdc; color:#17334d; padding:7px 12px; border-radius:12px; font-size:12px; font-weight:700; text-align:center; width:max-content; max-width:90vw; pointer-events:none; }
  #controls { position:fixed; bottom:max(18px, env(safe-area-inset-bottom)); left:0; right:0; display:flex; justify-content:space-between; align-items:end; padding:0 18px; pointer-events:none; }
  .cluster { display:flex; gap:12px; align-items:end; }
  .ctrl { pointer-events:auto; width:66px; height:66px; border:3px solid #ffffffcc; border-radius:20px; background:#183451cc; color:white; font-size:27px; font-weight:900; box-shadow:0 5px 0 #10233a99; user-select:none; touch-action:none; }
  .ctrl:active { transform:translateY(3px); box-shadow:0 2px 0 #10233a99; background:#2367a0; }
  #jump { width:78px; height:78px; border-radius:50%; background:#ff9f1c; font-size:17px; color:#fff; }
  #message { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#081a2b88; padding:22px; }
  #panel { max-width:340px; width:100%; border:3px solid white; border-radius:24px; background:linear-gradient(#fff,#eaf7ff); color:#17334d; text-align:center; padding:24px 20px; box-shadow:0 12px 35px #00182d66; }
  #panel h1 { margin:0 0 8px; font-size:28px; }
  #panel p { margin:8px 0 18px; line-height:1.6; }
  #restart { border:0; border-radius:14px; background:#1684db; color:white; padding:12px 24px; font-size:17px; font-weight:800; }
  #footer { position:fixed; bottom:6px; left:50%; transform:translateX(-50%); color:#ffffffd9; font-size:10px; text-shadow:0 1px 3px #123; pointer-events:none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="pill">🪙 النقاط: <span id="score">0</span></div>
  <div class="pill">⭐ SAIF OBBY</div>
</div>
<div id="hint">اجمع العملات ووصل للعلم الأخضر!</div>
<div id="controls">
  <div class="cluster">
    <button class="ctrl" id="left" aria-label="يسار">◀</button>
    <button class="ctrl" id="right" aria-label="يمين">▶</button>
  </div>
  <button class="ctrl" id="jump">اقفز ⤴</button>
</div>
<div id="footer">SAIF OBBY • نسخة تجريبية</div>
<div id="message">
  <div id="panel">
    <h1 id="endTitle">برافو! 🎉</h1>
    <p id="endText">وصلت للنهاية!</p>
    <button id="restart">العب من جديد</button>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const message = document.getElementById('message');
  const endTitle = document.getElementById('endTitle');
  const endText = document.getElementById('endText');
  let W=innerWidth, H=innerHeight, dpr=1, camera=0, score=0, won=false, dead=false;
  const worldWidth=2100, floorY=0;
  const platforms = [
    {x:0,y:0,w:250,h:45}, {x:315,y:-70,w:145,h:22}, {x:515,y:-145,w:140,h:22},
    {x:715,y:-80,w:145,h:22}, {x:930,y:-165,w:145,h:22}, {x:1140,y:-95,w:145,h:22},
    {x:1350,y:-180,w:150,h:22}, {x:1570,y:-105,w:150,h:22}, {x:1785,y:-175,w:150,h:22},
    {x:1980,y:-70,w:120,h:45}
  ];
  const coins = [
    {x:365,y:-112,taken:false},{x:565,y:-188,taken:false},{x:765,y:-123,taken:false},
    {x:980,y:-208,taken:false},{x:1190,y:-138,taken:false},{x:1405,y:-223,taken:false},
    {x:1625,y:-148,taken:false},{x:1840,y:-218,taken:false}
  ];
  const spikes = [
    {x:190,y:-17,w:34,h:17},{x:590,y:-167,w:32,h:22},{x:1000,y:-187,w:35,h:22},
    {x:1450,y:-202,w:35,h:22},{x:1680,y:-127,w:35,h:22}
  ];
  const player = {x:55,y:-80,w:28,h:38,vx:0,vy:0,onGround:false};
  const keys={left:false,right:false};
  const gravity=0.62, moveSpeed=4.2, jumpPower=12.8;
  function resize(){
    W=innerWidth; H=innerHeight; dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resize); resize();
  function reset(){
    player.x=55; player.y=-80; player.vx=0; player.vy=0; player.onGround=false;
    camera=0; score=0; won=false; dead=false;
    coins.forEach(c=>c.taken=false);
    scoreEl.textContent=score; message.style.display='none';
  }
  function end(win){
    if(won||dead)return;
    won=win; dead=!win; message.style.display='flex';
    endTitle.textContent=win?'برافو! 🎉':'أووه! 😵';
    endText.textContent=win?`ربحت المرحلة وجمعت ${score} عملة!`:'لمست فخًّا أو طحت! جرّب مرة أخرى.';
  }
  function worldToScreenY(y){ return H*0.68 + y; }
  function rect(x,y,w,h,color,r=0){
    const sy=worldToScreenY(y);
    ctx.fillStyle=color;
    if(r){ctx.beginPath();ctx.roundRect(x-camera,sy,w,h,r);ctx.fill();}
    else ctx.fillRect(x-camera,sy,w,h);
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#65caff'); sky.addColorStop(1,'#e3f9ff');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
    // clouds
    for(let i=0;i<9;i++){
      let x=((i*265-camera*0.25)%(W+180)+W+180)%(W+180)-80;
      ctx.fillStyle='#ffffffb8';
      ctx.beginPath();ctx.ellipse(x,80+(i%3)*43,36,15,0,0,Math.PI*2);ctx.ellipse(x+24,73+(i%3)*43,28,20,0,0,Math.PI*2);ctx.fill();
    }
    // distant hills
    ctx.fillStyle='#8be0b2';
    ctx.beginPath();ctx.moveTo(0,H*0.72);
    for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,H*0.72+Math.sin((x+camera*.12)/65)*14);
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
    // lava
    ctx.fillStyle='#ff5b4d';ctx.fillRect(0,H*0.91,W,H*.09);
    for(const p of platforms){
      rect(p.x,p.y,p.w,p.h,'#3c9b53',8);
      rect(p.x,p.y,p.w,7,'#78e65b',6);
      rect(p.x+8,p.y+p.h-4,Math.max(0,p.w-16),4,'#287343',2);
    }
    // spikes
    for(const s of spikes){
      const sy=worldToScreenY(s.y);
      ctx.fillStyle='#ed3d55';ctx.beginPath();
      ctx.moveTo(s.x-camera,sy+s.h);ctx.lineTo(s.x-camera+s.w/2,sy);ctx.lineTo(s.x-camera+s.w,sy+s.h);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#a51e38';ctx.lineWidth=2;ctx.stroke();
    }
    // coins
    for(const c of coins){
      if(c.taken)continue;
      const sx=c.x-camera, sy=worldToScreenY(c.y);
      ctx.fillStyle='#ffb800';ctx.beginPath();ctx.arc(sx,sy,10,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff0a0';ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle='#fff4c1';ctx.fillRect(sx-2,sy-6,4,12);
    }
    // finish flag
    const fx=2030-camera, fy=worldToScreenY(-115);
    ctx.strokeStyle='#ffffff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx,fy-85);ctx.stroke();
    ctx.fillStyle='#24d36b';ctx.beginPath();ctx.moveTo(fx,fy-85);ctx.lineTo(fx+45,fy-72);ctx.lineTo(fx,fy-58);ctx.closePath();ctx.fill();
    // player, screen coords
    const px=player.x-camera, py=worldToScreenY(player.y);
    ctx.fillStyle='#2c4f7c';ctx.fillRect(px+3,py+14,player.w-6,player.h-14);
    ctx.fillStyle='#f1bd91';ctx.fillRect(px+4,py,player.w-8,17);
    ctx.fillStyle='#302a39';ctx.fillRect(px+2,py-2,player.w-4,7);
    ctx.fillStyle='#ffffff';ctx.fillRect(px+8,py+6,4,4);ctx.fillRect(px+17,py+6,4,4);
    ctx.fillStyle='#172c45';ctx.fillRect(px+10,py+7,2,2);ctx.fillRect(px+18,py+7,2,2);
    ctx.fillStyle='#e5efff';ctx.fillRect(px+4,py+player.h-3,8,6);ctx.fillRect(px+17,py+player.h-3,8,6);
    // tiny jump indicator
    if(!player.onGround){ctx.fillStyle='#ffffffb0';ctx.font='bold 12px system-ui';ctx.fillText('↑',px+8,py-10);}
  }
  function overlap(a,b){return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;}
  function update(){
    if(!won&&!dead){
      player.vx=(keys.right?moveSpeed:0)-(keys.left?moveSpeed:0);
      const oldY=player.y;
      player.x+=player.vx;
      player.x=Math.max(0,Math.min(worldWidth-player.w,player.x));
      player.vy+=gravity; player.y+=player.vy; player.onGround=false;
      // Landing only while falling
      if(player.vy>=0){
        for(const p of platforms){
          const oldBottom=oldY+player.h, newBottom=player.y+player.h;
          if(player.x+player.w>p.x && player.x<p.x+p.w && oldBottom<=p.y && newBottom>=p.y){
            player.y=p.y-player.h; player.vy=0; player.onGround=true;
          }
        }
      }
      // spike collision
      for(const s of spikes){
        const box={x:s.x+5,y:s.y+5,w:s.w-10,h:s.h-5};
        if(overlap(player,box)){end(false);break;}
      }
      // collect coins
      for(const c of coins){
        if(!c.taken && Math.abs((player.x+player.w/2)-c.x)<20 && Math.abs((player.y+player.h/2)-c.y)<25){
          c.taken=true; score++; scoreEl.textContent=score;
        }
      }
      if(player.y>80 || player.x+player.w>=2015 && player.y>-105)end(player.x+player.w>=2015 && player.y>-105);
      camera=Math.max(0,Math.min(worldWidth-W,player.x-W*0.32));
    }
    draw(); requestAnimationFrame(update);
  }
  function jump(){
    if(!won&&!dead&&player.onGround){player.vy=-jumpPower;player.onGround=false;}
  }
  function bindHold(id, key){
    const el=document.getElementById(id);
    const down=e=>{e.preventDefault();keys[key]=true;};
    const up=e=>{e.preventDefault();keys[key]=false;};
    el.addEventListener('pointerdown',down);
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,up));
  }
  bindHold('left','left'); bindHold('right','right');
  document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump();});
  addEventListener('keydown',e=>{
    if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;
    if(['ArrowRight','d','D'].includes(e.key))keys.right=true;
    if([' ','ArrowUp','w','W'].includes(e.key)){e.preventDefault();jump();}
  });
  addEventListener('keyup',e=>{
    if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;
    if(['ArrowRight','d','D'].includes(e.key))keys.right=false;
  });
  document.getElementById('restart').addEventListener('click',reset);
  reset(); update();
})();
</script>
</body>
</html>
